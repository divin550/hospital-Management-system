<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Health Center</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-login-page">
  <main class="admin-login-card">
    <a class="admin-login-brand" href="../index.html"><span class="admin-logo-mark">H</span> Health Center</a>
    <h1>Admin Login</h1>
    <p class="login-subtitle">Sign in to manage your health center</p>
    <form id="admin-login-form" novalidate>
      <div class="form-group"><label for="admin-email">Email</label><input id="admin-email" class="form-control" type="email" placeholder="Enter your email"></div>
      <div class="form-group"><label for="admin-password">Password</label><input id="admin-password" class="form-control" type="password" placeholder="Enter your password"></div>
      <div class="checkbox"><label><input type="checkbox"> Remember me</label></div>
      <button class="btn btn-admin-primary btn-block" type="submit">Login</button>
    </form>
    <a class="login-home-link" href="../index.html"><i class="fa fa-long-arrow-left"></i> Back to Health Center</a>
  </main>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
